<!doctype html><html><head><meta charset="utf-8"><title>loading</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/oathbyte.css"><link rel="stylesheet" href="../css/keyart.css">
<style>
html,body{margin:0;background:#07060a;overflow:hidden}
#menu.ka{position:fixed;inset:0;overflow:hidden!important;background:#07060a!important}
.cell{position:absolute;width:920px;height:220px;overflow:hidden;background:linear-gradient(rgba(7,6,10,.55),rgba(7,6,10,.8)),url(../brand/ka/key-wide.webp) 50% 78%/1400px auto no-repeat}
.cell h4{margin:18px 0 0;text-align:center;font:600 12px var(--ob-head);letter-spacing:.32em;text-transform:uppercase;color:#c9ced8}
.cell #classes{position:absolute;left:20px;right:20px;top:58px}
</style></head><body><div id="menu" class="ka"></div>
<script>
const C={warden:['Warden','Melee','d8a040'],ranger:['Ranger','Bow','4aa850'],arcanist:['Arcanist','Arcane','9a5aff'],brawler:['Brawler','Physical','e0503a'],elementalist:['Elementalist','Spell caster','ff7a2a']};
const FPS=12,PICK=4.5,q=new URLSearchParams(location.search),f0=+(q.get('f')||0),N=8,menu=document.getElementById('menu');
const row=sel=>Object.keys(C).map(id=>`<div class="ccard${id===sel?' on':''}" data-c="${id}" style="--cc:#${C[id][2]}"><i class="cpic" style="background-image:url(../brand/ka/cls-${id}.webp)"></i><i class="cfx"></i><i class="caura"></i><i class="crim"></i><div class="cl">New</div><div class="cn">${C[id][0]}</div><div class="ct">${C[id][1]}</div></div>`).join('');
const cells=[];for(let k=0;k<N;k++){const d=document.createElement('div');d.className='cell';d.style.left=(20+(k%2)*940)+'px';d.style.top=(20+Math.floor(k/2)*240)+'px';d.innerHTML='<h4>Choose your hero</h4><div id="classes">'+row('warden')+'</div>';menu.appendChild(d);cells.push(d);}
const imgs=Object.keys(C).map(id=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src='../brand/ka/cls-'+id+'.webp';})).concat([new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src='../brand/ka/key-wide.webp';})]);
Promise.all([document.fonts.ready,...imgs]).then(()=>{
  cells.forEach((d,k)=>{const t=(f0+k)/FPS;const g=d.querySelector('#classes');getComputedStyle(g.lastChild).transform;
    if(t>=PICK){g.querySelector('[data-c=warden]').classList.remove('on');g.querySelector('[data-c=ranger]').classList.add('on');g.querySelectorAll('.ccard').forEach(c=>getComputedStyle(c).transform);}
    d.getAnimations({subtree:true}).forEach(a=>{a.pause();const fresh=(a instanceof CSSTransition)||(t>=PICK&&['kaPulse','kaRing','kaBurst','kaName','kaFlash','kaSpin'].includes(a.animationName));a.currentTime=(fresh?t-PICK:t)*1000;});
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.title='ready '+f0;}));
});
</script></body></html>

<!doctype html>
<meta charset="utf-8">
<title>OathByte UI test</title>
<!-- Build 0098 tooling: loads the real public/index.html and scripts, but swaps the WebGL renderer for a stub,
     so the HUD, menus and panels can be checked in a browser without WebGL (the world stays black).
     Open as tools/uitest.html?tj=1 for the touch layout. Not served by the game server. -->
<script>
(async () => {
  const q = new URLSearchParams(location.search), base = new URL('../public/', location.href).href;
  let html = await (await fetch(base + 'index.html', { cache: 'no-store' })).text();
  const stub = `<script>(() => {
    const mk = () => { const f = function () { return S; }; const S = new Proxy(f, { get(t, k) { if (k === Symbol.toPrimitive) return () => 0; if (k === 'then') return undefined; if (k === 'length') return 0; if (k === Symbol.iterator) return function* () {}; if (k in t.__p) return t.__p[k]; return S; }, set(t, k, v) { t.__p[k] = v; return true; }, apply() { return S; }, construct() { return S; } }); f.__p = {}; return S; };
    for (const k of Object.keys(GLX)) if (typeof GLX[k] === 'function' && k !== 'col') GLX[k] = () => mk();
    GLX.init = () => true; GLX.resize = () => {}; GLX.render = () => {}; GLX.model = () => null; GLX.modelInfo = () => ({}); GLX.envInfo = () => ({}); GLX.groundAt = () => 0; GLX.drawModel = () => {}; GLX.attach = () => null;
    GLX.toScreen = (x, y, z) => { if (typeof P === 'undefined') return null; const w = innerWidth, h = innerHeight; return [w / 2 + (x - P.x) * 22, h / 2 + (z - P.z) * 16 - (y || 0) * 18]; };
    window.__glxStub = 1;
    if (/[?&]tj=1/.test(location.search)) { const mm = window.matchMedia.bind(window); window.matchMedia = q => /pointer:\s*coarse/.test(q) ? { matches: true, media: q, addListener() {}, removeListener() {}, addEventListener() {}, removeEventListener() {} } : mm(q); }
    if (/[?&]items=1/.test(location.search)) { const iv = setInterval(() => { try { if (G.state === 'play' && G.hero && P.stats) { clearInterval(iv); for (let i = 0; i < 6; i++) G.hero.inv[i] = makeItem(G.hero.level + 2, null, 1 + (i % 4)); UI.refreshBag && UI.refreshBag(); } } catch (e) { } }, 500); }
    if (/[?&]atlas=[0-9]+/.test(location.search)) { const nl = +new URLSearchParams(location.search).get('atlas'), iv = setInterval(() => { try { if (G.state === 'play' && G.hero && P.stats) { clearInterval(iv); stState().a = STORY.length; atlasCheck(); const A = atlasOf(); for (let i = 0; i < Math.min(nl, ATLAS.length); i++) A.lit[i] = 1; for (const t of [2, 4, 7, 10]) A.maps.push(mapMake(t)); if (nl >= 6) { A.pts.g = 2; A.pts.m = 1; } enterTown(); setTimeout(() => UI.openAtlas(), 600); } } catch (e) { console.error(e); } }, 500); } /* build 0119 Atlas screenshots: ?atlas=6 lights the first 6 regions (20 = all, pinnacle open) */
    if (/[?&]parties=1/.test(location.search)) { const f0 = window.fetch.bind(window); window.fetch = (u, o) => /(^|[/])parties$/.test(String(u)) ? Promise.resolve({ ok: true, json: () => Promise.resolve({ max: 8, parties: [{ code: 'ember', floor: 6, players: [{ n: 'Lee', c: 'warden', l: 24 }, { n: 'Sam', c: 'ranger', l: 21 }] }, { code: 'auto3', floor: 2, players: [{ n: 'Moss', c: 'arcanist', l: 7 }] }] }) }) : f0(u, o); } /* sample party list for screenshots */
    if (/[?&]lv=[0-9]+/.test(location.search)) { const qq = new URLSearchParams(location.search), lv = +qq.get('lv'), tp = (qq.get('tal') || '').split(','), iv = setInterval(() => { try { if (G.state === 'play' && G.hero && P.stats) { clearInterval(iv); const h = G.hero; h.level = lv; h.tal = tp.map(x => x === '' ? null : +x); computeStats(); applyKit(h); UI.buildBar && UI.buildBar(); if (qq.get('skl')) UI.toggleSkl(true); } } catch (e) { } }, 500); } /* talent screenshots: ?lv=35&tal=0,1,,2&skl=1 */
    if (/[?&]adv=/.test(location.search)) { const sc = new URLSearchParams(location.search).get('adv'), iv = setInterval(() => { try { if (G.state === 'play' && G.hero && P.stats && typeof ADV !== 'undefined') { clearInterval(iv); const h = G.hero; /* advisor screenshots: ?adv=gear|pot|tal|talpick|forge|bag|quest */
      if (sc === 'gear' || sc === 'bag') { h.level = Math.max(h.level, 8); for (let i = 0; i < 4; i++) h.inv[i * 2] = makeItem(h.level + 3, null, 2 + (i % 2)); }
      if (sc === 'bag') for (let i = 0; i < 40; i++) addItem(makeItem(2, 'chest', 0));
      if (sc === 'tal') { h.level = 12; h.tal = []; applyKit(h); }
      if (sc === 'talpick') { h.tal = [0, 1, null, 2, 0]; } /* talent screen with Recommended marks: some rows held, the rest open */
      if (sc === 'pot') { P.fl = 3; }
      if (sc === 'forge') { h.ember = 140; }
      computeStats(); if (sc === 'pot') { P.hp = Math.round(P.stats.maxLife * .22); P.lastHit = G.time; } UI.buildBar && UI.buildBar(); UI.invDirty = true; setTimeout(() => sc === 'talpick' ? UI.toggleSkl(true) : ADV.show(true), 600); } } catch (e) { } }, 500); }
    /* build 0114: ?fake3d=1 stands in for items3d.js (this browser has no WebGL): same contract as the real module, the pictures are plain shaded discs marked 3D.
       Each picture is drawn only after the bag has been open for &hold= ms (default 3000; 0 = draw at once in the background), one every &per= ms (default 150), so a slow device can be seen. */
    if (/[?&]fake3d=1/.test(location.search)) { const qq = new URLSearchParams(location.search), hold = +(qq.get('hold') || 3000), per = +(qq.get('per') || 150), cache = new Map(), queue = [], queued = new Set(); let busy = false, openAt = 0;
      const key = it => [it.slot, it.base, it.rar, it.name].join('|'), RC = ['#c8c8c8', '#c8c8c8', '#4a8cff', '#ffd040', '#ff8020', '#30e0a0', '#ff4060'];
      const draw = it => { const c = document.createElement('canvas'); c.width = c.height = 88; const x = c.getContext('2d'), g = x.createRadialGradient(32, 28, 4, 44, 44, 40); g.addColorStop(0, '#fff'); g.addColorStop(.3, RC[it.rar] || '#ddd'); g.addColorStop(1, '#141018'); x.fillStyle = g; x.beginPath(); x.arc(44, 44, 36, 0, 7); x.fill(); x.fillStyle = '#fff'; x.font = 'bold 24px sans-serif'; x.textAlign = 'center'; x.fillText('3D', 44, 53); return c.toDataURL(); };
      const step = () => { const inv = document.getElementById('inv'); if (hold > 0 && (!inv || inv.classList.contains('hide'))) { openAt = 0; setTimeout(step, 100); return; } if (!openAt) openAt = performance.now(); if (performance.now() - openAt < hold) { setTimeout(step, 50); return; }
        const j = queue.shift(); if (!j) { busy = false; return; } queued.delete(j.k); const u = draw(j.it); cache.set(j.k, u); for (const el of document.querySelectorAll('[data-m3="' + CSS.escape(j.k) + '"]')) { const im = new Image(); im.className = 'm3 in'; im.alt = ''; im.src = u; el.replaceWith(im); } if (queue.length) setTimeout(step, per); else busy = false; };
      const mod = { ok: true, spec: () => false, showcase: h => h.remove(), icon: it => { const k = key(it); if (cache.has(k)) return { url: cache.get(k) }; if (!queued.has(k)) { queue.push({ k, it }); queued.add(k); if (!busy) { busy = true; setTimeout(step, 0); } } return { key: k }; } };
      window.__i3load = () => new Promise(r => setTimeout(() => r({ default: mod }), 300)); }
    /* build 0154: ?hud=1 shows the World boss teleport button, the online line and a kill streak like an online boss fight, to check the right-hand layout */
    if (/[?&]hud=1/.test(location.search)) { const iv = setInterval(() => { try { if (G.state === 'play' && G.hero && P.stats) { clearInterval(iv); const pb = document.getElementById('party'), st = document.getElementById('streak'), on = document.getElementById('onl'); pb.classList.remove('hide'); pb.dataset.k = ''; pb.innerHTML = '<div class="pth">Tap to teleport</div><button class="wbgo">\u279c World boss</button>'; st.classList.remove('hide'); document.getElementById('st1').textContent = '19'; document.getElementById('st3').textContent = '+8% drop luck'; if (on) { on.classList.remove('hide'); on.textContent = '1 online'; } const keep = () => { for (const e of [pb, st, on]) if (e && e.classList.contains('hide')) e.classList.remove('hide'); }; new MutationObserver(keep).observe(pb, { attributes: true }); new MutationObserver(keep).observe(st, { attributes: true }); if (on) new MutationObserver(keep).observe(on, { attributes: true }); setInterval(() => { G.streak = 19; G.streakT = 99; keep(); }, 200); } } catch (e) { } }, 500); }
    window.addEventListener('error', e => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;background:#900;color:#fff;font:12px monospace;padding:2px 6px;max-width:100vw'; d.textContent = 'ERR ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno; (document.body || document.documentElement).appendChild(d); });
  })();<\/script>`;
  html = html.replace('<head>', '<head><base href="' + base + '">').replace(/(<script src="js\/gl\.js[^"]*"><\/script>)/, '$1' + stub);
  if (q.get('tj')) html = html.replace('<body', '<body class="tj"');
  document.open(); document.write(html); document.close();
})();
</script>
